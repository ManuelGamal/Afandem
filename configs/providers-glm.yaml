# The agent on its fallback model alone, to measure what the hosted demo answers with when
# Gemini is rate-limited:  MODERATOR_PROVIDERS=configs/providers-glm.yaml
providers:
  - name: nebius-glm-5.3-flash
    model: zai-org/GLM-5.3-Flash
    usd_per_mtok_in: 0.15   # Nebius price, 2026-10-06
    usd_per_mtok_out: 0.5
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
    max_tokens: 1500
    timeout_s: 90
