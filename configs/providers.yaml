# Order = preference; providers whose key env var is missing are skipped. Each Gemini model has
# its own free quota, so extra Flash-Lite models multiply capacity. Ids verified with
# `uv run python -m moderator.providers.list_models` on 2026-10-05.
providers:
  - name: gemini-3.5-flash-lite
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  - name: gemini-3.5-flash-lite-k2
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_2
  - name: gemini-3.5-flash-lite-k3
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_3
  - name: gemini-3.5-flash-lite-k4
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_4
  - name: gemini-3.5-flash-lite-k5
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_5
  - name: gemini-3.1-flash-lite
    model: gemini-3.1-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  - name: gemini-3.8-flash
    model: gemini-3.8-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  # Nebius Token Factory: a different vendor, so the demo keeps answering when Gemini's free tier
  # is rate-limited. Chosen by a probe of six Nebius models on the real agent (best Egyptian Arabic).
  - name: nebius-glm-5.3-flash
    model: zai-org/GLM-5.3-Flash
    usd_per_mtok_in: 0.15   # Nebius price, 2026-10-06
    usd_per_mtok_out: 0.5
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
    max_tokens: 1500
    timeout_s: 90
  - name: groq-qwen
    model: qwen/qwen3.6-27b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
