# Simulated customers on Nebius: a different model family from the agent (Gemini) and from its
# fallback (GLM), so no model plays both sides. Used for the fresh held-out runs.
providers:
  - name: sim-qwen3-235b
    model: Qwen/Qwen3-235B-A22B-Instruct-2507
    usd_per_mtok_in: 0.2   # Nebius price, 2026-10-06
    usd_per_mtok_out: 0.6
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
    temperature: 0.7
    timeout_s: 90
  - name: sim-deepseek-v4-flash
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    usd_per_mtok_in: 0.14   # Nebius price, 2026-10-06
    usd_per_mtok_out: 0.28
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
    temperature: 0.7
    max_tokens: 1500
    timeout_s: 90
