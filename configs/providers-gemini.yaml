# The agent on one model, Gemini 3.5 Flash-Lite, for the reported bench runs. GEMINI_API_KEY_2..5
# are keys from other Google projects (more free quota); missing keys are skipped. No other model:
# when every key is rate-limited the run stops and resumes instead of switching models.
providers:
  - name: gemini-3.5-flash-lite
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  - name: gemini-3.5-flash-lite-k2
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_2
  - name: gemini-3.5-flash-lite-k3
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_3
  - name: gemini-3.5-flash-lite-k4
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_4
  - name: gemini-3.5-flash-lite-k5
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY_5
